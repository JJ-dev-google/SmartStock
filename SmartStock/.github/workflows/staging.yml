name: SmartStock Staging Deployment
on:
  push:
    branches: [staging]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: cd backend/handlers && zip -r ../../backend.zip .
      - run: |
          aws cloudformation deploy             --template-file infrastructure/template.yaml             --stack-name smartstock-staging             --parameter-overrides Environment=staging DeploymentBucket=${{ secrets.DEPLOYMENT_BUCKET }}             --capabilities CAPABILITY_IAM
