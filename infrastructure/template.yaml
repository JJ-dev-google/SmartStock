
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SmartStock - Serverless Inventory Management Platform

Parameters:
  Environment:
    Type: String
    Default: echo
    AllowedValues:
      - echo
      - staging
      - production

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

Resources:

  # S3 bucket for persistent inventory and order data
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'smartstock-data-${Environment}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Private S3 bucket for frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'smartstock-web-${Environment}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Lambda execution role and permissions
  SmartStockLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SmartStockS3DataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DataBucket.Arn}/*'

  # API Gateway REST API
  SmartStockApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'smartstock-api-${Environment}'
      StageName: !Ref Environment
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # Node.js Lambda backend
  SmartStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'smartstock-${Environment}'
      CodeUri: ../backend/
      Handler: index.handler
      Role: !GetAtt SmartStockLambdaRole.Arn
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /products
            Method: GET

        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /products
            Method: POST

        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /products/{id}
            Method: PUT

        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /products/{id}
            Method: DELETE

        GetOrders:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /orders
            Method: GET

        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /orders
            Method: POST

        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref SmartStockApi
            Path: /dashboard
            Method: GET

  # CloudFront private S3 origin access
  FrontendOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'smartstock-oac-${Environment}'
        Description: Private SmartStock frontend access
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Frontend CDN
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: SmartStockS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SmartStockS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # Allow only this CloudFront distribution to read frontend files
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
                  - DistributionId: !Ref FrontendDistribution

Outputs:
  FrontendBucketName:
    Description: Private frontend S3 bucket
    Value: !Ref FrontendBucket

  DataBucketName:
    Description: Inventory data S3 bucket
    Value: !Ref DataBucket

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref FrontendDistribution

  WebsiteURL:
    Description: SmartStock website
    Value: !Sub 'https://${FrontendDistribution.DomainName}'

  ApiURL:
    Description: SmartStock REST API
    Value: !Sub 'https://${SmartStockApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
